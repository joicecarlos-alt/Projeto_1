
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuidados com o Cabelo</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:20px;
}

h1{
    color:#e91e63;
}

div{
    background:white;
    padding:20px;
    border-radius:10px;
}

button{
    background:#e91e63;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>
<body>

<div>

<h1>Cuidados com o Cabelo</h1>

<p>Evite lavar o cabelo todos os dias.</p>

<p>Prefira água morna ou fria.</p>

<p>A água quente pode:</p>

<ul>
    <li>Remover a hidratação natural.</li>
    <li>Ressecar os fios.</li>
    <li>Aumentar o frizz.</li>
    <li>Estimular a oleosidade.</li>
</ul>

<button onclick="mensagem()">Saiba Mais</button>

<p id="texto"></p>

</div>

<script>
function mensagem(){
    document.getElementById("texto").innerHTML =
    "Use água morna ou fria para manter os cabelos mais saudáveis.";
}
</script>

</body>
</html>
